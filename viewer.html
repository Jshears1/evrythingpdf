  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
  /* pdf.js worker: load as same-origin blob — browsers block cross-origin Workers (SecurityError) */
  const WORKER_URL='https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER_URL;
  const workerReady=fetch(WORKER_URL).then(r=>r.text()).then(t=>{pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));}).catch(()=>{});
  </script>
  <script src="app.js"></script>
  <script>
    let pdfDoc=null, curPage=1, curScale=1.0, pdfFile=null;
    initDropZone('dropZone','fileInput',async function(files){
      pdfFile=files[0];
      const bytes=await files[0].arrayBuffer();
      await workerReady;
      pdfDoc=await pdfjsLib.getDocument({data:bytes}).promise;
      curPage=1; curScale=1.0;
      document.getElementById('viewerContainer').style.display='block';
      document.getElementById('dropZone').style.display='none';
      renderPage();
    });
    async function renderPage(){
      const page=await pdfDoc.getPage(curPage);
      const vp=page.getViewport({scale:curScale*(window.devicePixelRatio||1)});
      const canvas=document.getElementById('pdfCanvas');
      const ctx=canvas.getContext('2d');
      canvas.height=vp.height; canvas.width=vp.width;
      canvas.style.width=Math.round(vp.width/(window.devicePixelRatio||1))+'px';
      canvas.style.height=Math.round(vp.height/(window.devicePixelRatio||1))+'px';
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      document.getElementById('pageInfo').textContent='Page '+curPage+' of '+pdfDoc.numPages;
      document.getElementById('prevBtn').disabled=curPage<=1;
      document.getElementById('nextBtn').disabled=curPage>=pdfDoc.numPages;
      document.getElementById('zoomLabel').textContent=Math.round(curScale*100)+'%';
    }
    function prevPage(){if(curPage>1){curPage--;renderPage();}}
    function nextPage(){if(curPage<pdfDoc.numPages){curPage++;renderPage();}}
    function zoomIn(){curScale=Math.min(curScale+0.25,3);renderPage();}
    function zoomOut(){curScale=Math.max(curScale-0.25,0.25);renderPage();}
    function downloadCurrent(){
      if(!pdfFile) return;
      const a=document.createElement('a'); a.href=URL.createObjectURL(pdfFile); a.download=pdfFile.name; a.click();
    }
  </script>
