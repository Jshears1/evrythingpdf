  <script src="app.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    let pdfFile=null, pdfDoc=null, curPage=1, scale=1.5, drawing=false, paths=[], curPath=[];
    const dc=document.getElementById('drawCanvas'), dctx=dc.getContext('2d');
    initDropZone('dropZone','fileInput',async function(files){
      pdfFile=files[0];
      const bytes=await files[0].arrayBuffer();
      pdfDoc=await pdfjsLib.getDocument({data:bytes}).promise;
      document.getElementById('dropZone').style.display='none';
      document.getElementById('toolbar').style.display='block';
      await renderPage();
    });
    async function renderPage(){
      const page=await pdfDoc.getPage(curPage);
      const vp=page.getViewport({scale});
      const pc=document.getElementById('pdfCanvas');
      pc.width=vp.width; pc.height=vp.height;
      dc.width=vp.width; dc.height=vp.height;
      await page.render({canvasContext:pc.getContext('2d'),viewport:vp}).promise;
      redrawPaths();
    }
    function redrawPaths(){
      dctx.clearRect(0,0,dc.width,dc.height);
      paths.forEach(p=>{
        dctx.beginPath(); dctx.strokeStyle=p.color; dctx.lineWidth=p.size; dctx.globalAlpha=p.opacity; dctx.lineCap='round'; dctx.lineJoin='round';
        p.pts.forEach((pt,i)=>i===0?dctx.moveTo(pt.x,pt.y):dctx.lineTo(pt.x,pt.y));
        dctx.stroke();
      });
      dctx.globalAlpha=1;
    }
    function getPos(e){
      const r=dc.getBoundingClientRect();
      const src=e.touches?e.touches[0]:e;
      return {x:src.clientX-r.left,y:src.clientY-r.top};
    }
    dc.addEventListener('mousedown',e=>{drawing=true;curPath=[getPos(e)];});
    dc.addEventListener('mousemove',e=>{if(!drawing)return;const pt=getPos(e);curPath.push(pt);dctx.beginPath();dctx.strokeStyle=document.getElementById('drawColor').value;dctx.lineWidth=parseInt(document.getElementById('drawSize').value);dctx.globalAlpha=parseFloat(document.getElementById('drawOpacity').value);dctx.lineCap='round';dctx.moveTo(curPath[curPath.length-2].x,curPath[curPath.length-2].y);dctx.lineTo(pt.x,pt.y);dctx.stroke();dctx.globalAlpha=1;});
    dc.addEventListener('mouseup',()=>{if(drawing)paths.push({pts:[...curPath],color:document.getElementById('drawColor').value,size:parseInt(document.getElementById('drawSize').value),opacity:parseFloat(document.getElementById('drawOpacity').value)});drawing=false;curPath=[];});
    dc.addEventListener('mouseleave',()=>{if(drawing)dc.dispatchEvent(new MouseEvent('mouseup'));});
    dc.addEventListener('touchstart',e=>{e.preventDefault();dc.dispatchEvent(new MouseEvent('mousedown',{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY}));});
    dc.addEventListener('touchmove',e=>{e.preventDefault();dc.dispatchEvent(new MouseEvent('mousemove',{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY}));});
    dc.addEventListener('touchend',e=>{e.preventDefault();dc.dispatchEvent(new MouseEvent('mouseup'));});
    function clearDrawing(){paths=[];redrawPaths();}
    async function saveDrawing(){
      // Merge pdf + drawing canvas
      const {PDFDocument, rgb}=PDFLib;
      const bytes=await pdfFile.arrayBuffer();
      const doc=await PDFDocument.load(bytes);
      const page=doc.getPage(curPage-1);
      const {width,height}=page.getSize();
      // Flatten draw canvas to PNG
      const combined=document.createElement('canvas');
      combined.width=dc.width; combined.height=dc.height;
      const cctx=combined.getContext('2d');
      cctx.drawImage(dc,0,0);
      const imgData=combined.toDataURL('image/png');
      const imgBytes=await fetch(imgData).then(r=>r.arrayBuffer());
      const img=await doc.embedPng(imgBytes);
      page.drawImage(img,{x:0,y:0,width,height});
      const saved=await doc.save();
      const blob=new Blob([saved],{type:'application/pdf'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='annotated.pdf'; a.click();
      showToast('PDF saved!','success');
    }
  </script>
