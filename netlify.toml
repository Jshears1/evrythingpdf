[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), microphone=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Canonical domain: redirect www → non-www
[[redirects]]
  from = "https://www.evrythingpdf.com/*"
  to = "https://evrythingpdf.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.evrythingpdf.com/*"
  to = "https://evrythingpdf.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://evrythingpdf.com/*"
  to = "https://evrythingpdf.com/:splat"
