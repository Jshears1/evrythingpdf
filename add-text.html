  <script src="app.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    let pdfFile=null, pdfDoc=null, curPage=1, scale=1.5, annotations={};
    initDropZone('dropZone','fileInput',async function(files){
      pdfFile=files[0];
      const bytes=await files[0].arrayBuffer();
      pdfDoc=await pdfjsLib.getDocument({data:bytes}).promise;
      document.getElementById('dropZone').style.display='none';
      document.getElementById('toolbar').style.display='block';
      document.getElementById('pdfWrap').style.display='inline-block';
      document.getElementById('pageNav').style.display='flex';
      renderPage();
    });
    async function renderPage(){
      const page=await pdfDoc.getPage(curPage);
      const vp=page.getViewport({scale});
      const canvas=document.getElementById('pdfCanvas');
      const overlay=document.getElementById('textOverlay');
      canvas.width=vp.width; canvas.height=vp.height;
      overlay.style.width=vp.width+'px'; overlay.style.height=vp.height+'px';
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
      // Restore annotations for this page
      overlay.innerHTML='';
      (annotations[curPage]||[]).forEach(a=>addAnnotationEl(a.x,a.y,a.text,a.size,a.color));
      document.getElementById('pageInfo').textContent='Page '+curPage+' of '+pdfDoc.numPages;
      document.getElementById('prevPage').disabled=curPage<=1;
      document.getElementById('nextPage').disabled=curPage>=pdfDoc.numPages;
    }
    function changePage(dir){saveAnnotations(); curPage+=dir; if(curPage<1)curPage=1; if(curPage>pdfDoc.numPages)curPage=pdfDoc.numPages; renderPage();}
    function saveAnnotations(){
      const overlay=document.getElementById('textOverlay');
      const canvas=document.getElementById('pdfCanvas');
      annotations[curPage]=[...overlay.querySelectorAll('.text-annotation')].map(el=>({x:parseInt(el.style.left),y:parseInt(el.style.top),text:el.innerText,size:el.style.fontSize,color:el.style.color}));
    }
    function addAnnotationEl(x,y,text='Click to type',size='14px',color='#000'){
      const overlay=document.getElementById('textOverlay');
      const el=document.createElement('div'); el.className='text-annotation'; el.contentEditable='true';
      el.style.cssText=`left:${x}px;top:${y}px;font-size:${size};color:${color};position:absolute`;
      el.innerText=text;
      // Drag
      let dragging=false,ox=0,oy=0;
      el.addEventListener('mousedown',e=>{if(e.target!==el)return; dragging=true; ox=e.clientX-el.offsetLeft; oy=e.clientY-el.offsetTop; e.preventDefault();});
      document.addEventListener('mousemove',e=>{if(!dragging)return; el.style.left=(e.clientX-ox)+'px'; el.style.top=(e.clientY-oy)+'px';});
      document.addEventListener('mouseup',()=>dragging=false);
      overlay.appendChild(el); setTimeout(()=>el.focus(),50);
    }
    document.getElementById('textOverlay').addEventListener('click',function(e){
      if(e.target===this){
        const rect=this.getBoundingClientRect();
        const size=document.getElementById('tFontSize').value+'px';
        const color=document.getElementById('tColor').value;
        addAnnotationEl(e.clientX-rect.left,e.clientY-rect.top,'',size,color);
      }
    });
    async function saveWithText(){
      saveAnnotations();
      const {PDFDocument,rgb,StandardFonts}=PDFLib;
      const bytes=await pdfFile.arrayBuffer();
      const doc=await PDFDocument.load(bytes);
      const font=await doc.embedFont(StandardFonts.Helvetica);
      const canvas=document.getElementById('pdfCanvas');
      for(const [pageNum,annots] of Object.entries(annotations)){
        if(!annots.length) continue;
        const page=doc.getPage(parseInt(pageNum)-1);
        const {height}=page.getSize();
        annots.forEach(a=>{
          const txt=a.text.trim(); if(!txt) return;
          const fSize=parseInt(a.size)||14;
          const col=hexToRgb(a.color||'#000000');
          const pdfX=a.x/scale;
          const pdfY=height-(a.y/scale)-fSize;
          page.drawText(txt,{x:pdfX,y:pdfY,size:fSize,font,color:col});
        });
      }
      const saved=await doc.save();
      const blob=new Blob([saved],{type:'application/pdf'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='annotated.pdf'; a.click();
      showToast('PDF saved with text!','success');
    }
    function hexToRgb(hex){
      const r=parseInt(hex.slice(1,3),16)/255;
      const g=parseInt(hex.slice(3,5),16)/255;
      const b=parseInt(hex.slice(5,7),16)/255;
      return PDFLib.rgb(r,g,b);
    }
  </script>
